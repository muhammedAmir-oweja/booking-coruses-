; Project-local PHP overrides for file uploads (task 25).
;
; StoreCourseFileRequest allows 25 MB, but a validation rule is a lie if PHP
; rejects the request first: the stock upload_max_filesize is 2M, and a
; too-large POST arrives with an empty $_FILES, so Laravel reports
; "The file failed to upload." rather than "too large".
;
; Applied without touching the system php.ini by ADDING this directory to the
; scan path (see composer.json's "serve" script, or export it yourself):
;   PHP_INI_SCAN_DIR=/etc/php/8.3/cli/conf.d:./.php-ini php artisan serve
;
; In production this belongs in the real php.ini / php-fpm pool config instead.
upload_max_filesize = 30M
post_max_size = 32M
